[package]
name = "nebula-registry-server"
version = "0.1.0"
description = "Runnable pre-alpha Nebula registry server with health, metrics, and registry API routes."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["nebula", "registry", "server"]
categories = ["development-tools", "web-programming"]
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "nebula-registry-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
better-auth.workspace = true
nebula-core = { path = "../nebula-core" }
nebula-registry = { path = "../nebula-registry" }
nebula-storage = { path = "../nebula-storage" }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
reqwest.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower = "0.5"
