[package]
name = "nebula-cli"
version = "0.1.0"
description = "Pre-alpha command-line interface for local Nebula source-control workflows."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["nebula", "cli", "source-control"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "neb"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clap_complete = "4.5.67"
clap_mangen = "0.2.32"
indicatif = "0.18.4"
nebula-core = { path = "../nebula-core" }
nebula-git = { path = "../nebula-git" }
nebula-local = { path = "../nebula-local" }
nebula-registry = { path = "../nebula-registry" }
nebula-storage = { path = "../nebula-storage" }
nebula-sync = { path = "../nebula-sync" }
nebula-vector = { path = "../nebula-vector" }
hex.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
serde = { workspace = true, features = ["derive"] }
keyring = "3.6.3"
rpassword = "7"

[dev-dependencies]
assert_cmd = "2.1.2"
assert_fs = "1.1.3"
predicates = "3.1.4"
