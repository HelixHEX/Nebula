name: Registry Container

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - Dockerfile.registry-server
      - .github/workflows/container-release.yml
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/nebula-registry-server
  RUST_VERSION: "1.89"

jobs:
  container:
    name: Build registry container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build registry image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.registry-server
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUST_VERSION=${{ env.RUST_VERSION }}
          sbom: true
          provenance: true

      - name: Generate source SBOM for pull requests
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: nebula-registry-server-source.spdx.json
          format: spdx-json
